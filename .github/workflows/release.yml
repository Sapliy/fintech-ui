name: Release - sapliy-ui

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sapliy-ui/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: cd sapliy-ui && npm ci

      - name: Build
        run: cd sapliy-ui && npm run build

      - name: Release
        run: cd sapliy-ui && npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}